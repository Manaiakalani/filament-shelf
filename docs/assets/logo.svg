<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Filament Shelf logo">
  <title>Filament Shelf</title>
  <defs>
    <clipPath id="side-fill">
      <circle cx="0" cy="0" r="20"/>
    </clipPath>
  </defs>
  <!-- back spool, side view -->
  <g transform="translate(61 43)">
    <circle r="26" fill="#FFFFFF" stroke="#C9CFDB" stroke-width="1.4"/>
    <circle r="20" fill="#E07030"/>
    <g clip-path="url(#side-fill)" stroke="rgba(21,25,39,.14)" stroke-width="1.15">
      <line x1="-20" y1="-14" x2="20" y2="-14"/>
      <line x1="-20" y1="-8.4" x2="20" y2="-8.4"/>
      <line x1="-20" y1="-2.8" x2="20" y2="-2.8"/>
      <line x1="-20" y1="2.8" x2="20" y2="2.8"/>
      <line x1="-20" y1="8.4" x2="20" y2="8.4"/>
      <line x1="-20" y1="14" x2="20" y2="14"/>
    </g>
    <circle r="6.2" fill="#F5F6F9" stroke="#C9CFDB" stroke-width="1.1"/>
    <circle r="2.3" fill="#E8EBF1"/>
  </g>
  <!-- front spool -->
  <g transform="translate(37 41)">
    <circle r="29" fill="#FFFFFF" stroke="#C9CFDB" stroke-width="1.4"/>
    <circle r="22.2" fill="#D45A20"/>
    <circle r="19.4" fill="none" stroke="rgba(21,25,39,.12)" stroke-width="1.05"/>
    <circle r="16.4" fill="none" stroke="rgba(21,25,39,.12)" stroke-width="1.05"/>
    <circle r="13.4" fill="none" stroke="rgba(21,25,39,.12)" stroke-width="1.05"/>
    <circle r="11.6" fill="#F5F6F9" stroke="#C9CFDB" stroke-width="1.15"/>
    <circle cx="0" cy="-7" r="1.85" fill="#E8EBF1"/>
    <circle cx="6.06" cy="3.5" r="1.85" fill="#E8EBF1"/>
    <circle cx="-6.06" cy="3.5" r="1.85" fill="#E8EBF1"/>
    <circle r="2.9" fill="#E8EBF1"/>
  </g>
  <!-- plank -->
  <rect x="14" y="74.5" width="68" height="8" rx="2.6" fill="#FFFFFF"/>
  <rect x="14" y="80.6" width="68" height="2.4" rx="1.2" fill="#C9CFDB"/>
</svg>
