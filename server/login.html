<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · Filament Shelf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8EBF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shelf">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="__APPCSS__">
<link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<main class="login">
  <img class="login-mark" src="__ICON__" alt="" width="88" height="88">
  <h1>Filament <br>Shelf</h1>
  <p class="login-sub">Sign in to see your shelf.</p>
  __MSG__
  <form method="post" action="/login" class="form">
    <label class="field"><span>Username</span>
      <input name="username" value="__NAME__" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="32"></label>
    <label class="field"><span>Password</span>
      <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button class="btn primary full" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
