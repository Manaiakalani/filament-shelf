# Copy to docker-compose.override.yml on nenebytes. That file stays off git.
# Compose loads it automatically beside compose.yaml. Do not pass -f, or this
# file is skipped.
#
# The app joins docker_default, the network the existing cloudflared already
# uses, and does not create a new Docker network. Phones on the Wi-Fi open
# port 3026, same idea as Kindred (3024) and Our Lives (3025).
# Do not start the tunnel profile.
services:
  app:
    ports: !override
      - "3026:8080"
    networks:
      - default

networks:
  default:
    name: docker_default
    external: true
