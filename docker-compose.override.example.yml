# Optional. Copy to docker-compose.override.yml (that copy stays off git).
# Compose loads it beside compose.yaml. Do not pass -f, or this file is skipped.
#
# Use this when the app should join a Docker network that already exists,
# for example one shared with a reverse proxy. Change the network name.
# Point that proxy at http://filament-shelf:8080. Do not start the tunnel
# profile if a tunnel container is already running.
services:
  app:
    networks:
      - default

networks:
  default:
    name: proxy
    external: true
